<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ status_code }} - 오류</title>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f8fafc;
            color: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }
        .error-card {
            width: 100%;
            max-width: 560px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
            padding: 28px 24px;
        }
        .status {
            margin: 0 0 10px 0;
            font-size: 0.95rem;
            color: #64748b;
            font-weight: 600;
        }
        h1 {
            margin: 0 0 10px 0;
            font-size: 1.5rem;
        }
        p {
            margin: 0 0 18px 0;
            color: #334155;
            line-height: 1.6;
        }
        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .btn {
            text-decoration: none;
            display: inline-block;
            border-radius: 8px;
            padding: 9px 14px;
            font-size: 0.92rem;
            border: 1px solid #cbd5e1;
            color: #0f172a;
            background: #f8fafc;
        }
        .btn-primary {
            background: #2563eb;
            color: #ffffff;
            border-color: #2563eb;
        }
    </style>
</head>
<body>
    <main class="error-card">
        <p class="status">Error {{ status_code }}</p>
        <h1>{{ title }}</h1>
        <p>{{ description }}</p>
        <div class="actions">
            <a class="btn btn-primary" href="/">홈으로 이동</a>
            <a class="btn" href="javascript:history.back()">이전 페이지</a>
        </div>
    </main>
</body>
</html>
