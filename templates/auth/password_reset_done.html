{% extends "main/base.html" %}

{% block title %}메일 발송 완료 - Anonymous Project{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <h2 class="auth-title">메일을 확인해 주세요</h2>
        <p class="auth-subtitle">
            입력한 이메일로 비밀번호 재설정 링크를 보냈습니다.
        </p>
        <p class="auth-subtitle">
            메일이 보이지 않으면 스팸함도 확인해 주세요.
        </p>

        <p class="auth-switch">
            <a href="{% url 'auth_login' %}">로그인 페이지로 이동</a>
        </p>
    </div>
</div>
{% endblock %}
