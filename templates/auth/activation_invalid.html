{% extends "main/base.html" %}

{% block title %}인증 실패 - Anonymous Project{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <h2 class="auth-title">인증 링크를 사용할 수 없습니다</h2>
        <p class="auth-subtitle">
            링크가 만료되었거나 잘못된 주소일 수 있습니다.
        </p>

        <p class="auth-subtitle">
            이미 계정이 있다면 로그인해 주세요.
            계정이 없다면 회원가입 후 새 인증 메일을 받아 진행할 수 있습니다.
        </p>

        <p class="auth-switch">
            <a href="{% url 'auth_login' %}" class="btn btn-primary auth-submit">로그인 하러 가기</a>
        </p>
        <p class="auth-switch">
            계정이 없으신가요?
            <a href="{% url 'auth_signup' %}">회원가입 하러 가기</a>
        </p>
    </div>
</div>
{% endblock %}
