{% extends "main/base.html" %}

{% block title %}인증 실패 - Anonymous Project{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <h2 class="auth-title">인증 링크를 사용할 수 없습니다</h2>
        <p class="auth-subtitle">
            링크가 만료되었거나 잘못된 주소일 수 있습니다.
        </p>

        <p class="auth-extra">
            이미 계정을 가지고 계시다면 로그인 페이지에서 바로 로그인을 시도해 주세요.<br>
            아니라면, 다시 회원가입을 진행해 주세요.
        </p>

        <div class="auth-actions">
            <a href="{% url 'auth_login' %}" class="btn btn-primary auth-submit" style="display:inline-block;text-align:center;margin-bottom:0.75rem;">
                로그인 하러 가기
            </a>
            <p class="auth-switch">
                계정이 없으신가요?
                <a href="{% url 'auth_signup' %}">회원가입 하러 가기</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
