{% extends "main/base.html" %}

{% block title %}비밀번호 재설정 - Anonymous Project{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <h2 class="auth-title">비밀번호 재설정</h2>
        <p class="auth-subtitle">
            가입한 이메일을 입력하면 비밀번호 재설정 링크를 보내드립니다.
        </p>

        <form method="post" class="auth-form">
            {% csrf_token %}
            {{ form.non_field_errors }}

            <div class="form-field">
                <label for="{{ form.email.id_for_label }}">이메일</label>
                {{ form.email }}
                {{ form.email.errors }}
            </div>

            <button type="submit" class="btn btn-primary auth-submit">재설정 링크 보내기</button>
        </form>

        <p class="auth-switch">
            로그인 페이지로 돌아가기
            <a href="{% url 'auth_login' %}">로그인 하러 가기</a>
        </p>
    </div>
</div>
{% endblock %}
