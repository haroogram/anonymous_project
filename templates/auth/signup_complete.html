{% extends "main/base.html" %}

{% block title %}회원가입 완료 - Anonymous Project{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <h2 class="auth-title">회원가입 신청이 완료되었습니다</h2>
        <p class="auth-subtitle">
            입력하신 이메일 주소로 계정 활성화 링크를 전송했습니다.<br>
            받은 편지함(또는 스팸함)을 확인해 주세요.
        </p>

        <p class="auth-extra">
            이메일에 포함된 링크를 클릭하면 계정이 활성화되고, 이후 로그인 화면에서 로그인하실 수 있습니다.
        </p>

        <a href="{% url 'auth_login' %}" class="btn btn-primary auth-submit" style="display:inline-block;text-align:center;">
            로그인 화면으로 이동
        </a>
    </div>
</div>
{% endblock %}
