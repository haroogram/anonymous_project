# anonymous_project Docker 이미지 빌드 후 Docker Hub 푸시
# → dso_project의 k8s-manifests/deployment.yaml에서 이 이미지를 참조하고,
#   ArgoCD가 repo polling으로 새 이미지 배포

name: Docker Build and Push to Docker Hub

on:
  push:
    tags:
      - 'v*'   # v1.1.4 등 푸시 시 semver 태그(1.1.4)로도 푸시
  workflow_dispatch:
    inputs:
      no_cache:
        description: '빌드 캐시 없이 전체 재빌드(apt 등 최신화). 평소 태그 빌드는 캐시 사용.'
        required: false
        default: false
        type: boolean
      release_version:
        description: '배포용 이미지/manifest 태그 (예: 1.2.5 또는 v1.2.5). 비우면 :sha-만 사용.'
        required: true
        default: ''
        type: string

env:
  REGISTRY: docker.io
  IMAGE_NAME: haroogram/anonymous-project

jobs:
  build-and-push:
    name: Build and Push Docker image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata and set tags
        id: meta
        env:
          DISPATCH_RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.release_version || '' }}
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          VERSION=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            RV="$(echo -n "${DISPATCH_RELEASE_VERSION:-}" | xargs)"
            RV="${RV#v}"
            if [[ -n "$RV" ]]; then
              VERSION="$RV"
            fi
          fi
          if [[ -n "$VERSION" ]]; then
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "image_tag=$VERSION" >> $GITHUB_OUTPUT
          else
            echo "image_tag=sha-${SHORT_SHA}" >> $GITHUB_OUTPUT
          fi
          {
            echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${SHORT_SHA}"
            echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
            if [[ -n "$VERSION" ]]; then
              echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}"
            fi
          } >> tags.txt
          echo "tags<<EOF" >> $GITHUB_OUTPUT
          cat tags.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          pull: true
          no-cache: ${{ github.event_name == 'workflow_dispatch' && inputs.no_cache }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "## Docker image pushed" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.IMAGE_NAME }}:sha-${{ steps.meta.outputs.short_sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.IMAGE_NAME }}:latest\`" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ steps.meta.outputs.version }}" ]; then
            echo "- \`${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          fi

  # K3s manifest 레포(dso_project)의 deployment.yaml image 태그를 새로 푸시한 태그로 갱신 후 push
  # → ArgoCD가 해당 repo를 polling 하므로 자동으로 새 이미지 배포
  update-manifest:
    name: Update K3s manifest and push
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: write
    env:
      DSO_REPO_TOKEN: ${{ secrets.DSO_REPO_TOKEN }}
    steps:
      - name: Checkout manifest repo (dso_project)
        if: ${{ env.DSO_REPO_TOKEN != '' }}  # 토큰이 있을 때만 실행 (선택적)
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.DSO_MANIFEST_REPO || 'haroogram/dso_project' }}
          token: ${{ env.DSO_REPO_TOKEN }}
          path: dso-project

      - name: Update deployment image tag
        if: ${{ env.DSO_REPO_TOKEN != '' }}
        run: |
          FILE="dso-project/k8s-manifests/deployment.yaml"
          FILE_JOB="dso-project/k8s-manifests/admin-superuser-job.yaml"
          FILE_WORKER="dso-project/k8s-manifests/celery-worker-deployment.yaml"
          FILE_BEAT="dso-project/k8s-manifests/celery-beat-deployment.yaml"
          IMAGE_TAG="${{ needs.build-and-push.outputs.image_tag }}"
          # image: haroogram/anonymous-project:<tag> 형태 한 줄만 교체
          sed -i "s|image: ${IMAGE_NAME}:.*|image: ${IMAGE_NAME}:${IMAGE_TAG}|" "$FILE"
          sed -i "s|image: ${IMAGE_NAME}:.*|image: ${IMAGE_NAME}:${IMAGE_TAG}|" "$FILE_JOB"
          echo "Deployment image line:"
          grep "image:" "$FILE"
          echo "Admin superuser job image line:"
          grep "image:" "$FILE_JOB"
          sed -i "s|image: ${IMAGE_NAME}:.*|image: ${IMAGE_NAME}:${IMAGE_TAG}|" "$FILE_WORKER"
          sed -i "s|image: ${IMAGE_NAME}:.*|image: ${IMAGE_NAME}:${IMAGE_TAG}|" "$FILE_BEAT"
          echo "Celery worker image line:"
          grep "image:" "$FILE_WORKER"
          echo "Celery beat image line:"
          grep "image:" "$FILE_BEAT"
        env:
          IMAGE_NAME: haroogram/anonymous-project

      - name: Commit and push
        if: ${{ env.DSO_REPO_TOKEN != '' }}
        run: |
          cd dso-project
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            k8s-manifests/deployment.yaml \
            k8s-manifests/admin-superuser-job.yaml \
            k8s-manifests/celery-worker-deployment.yaml \
            k8s-manifests/celery-beat-deployment.yaml
          if git diff --staged --quiet; then
            echo "No change in image tag, skip push."
          else
            git commit -m "chore(anonymous-project): update image to ${{ needs.build-and-push.outputs.image_tag }} [skip ci]"
            git push
          fi
